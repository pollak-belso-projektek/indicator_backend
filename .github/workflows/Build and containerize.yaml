name: Docker Build & Publish Microservices

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Run regression tests
        run: npm test

  build-main-service:
    name: Build Main Service 🏗️
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository code 🛎️
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx 🚀
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry 🚢
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Main Service
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-main-service
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Main Service 🏗️
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=main-service
          cache-to: type=gha,mode=max,scope=main-service

  build-login-service:
    name: Build Login Service 🔐
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository code 🛎️
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx 🚀
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry 🚢
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Login Service
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-login-service
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Login Service 🔐
        uses: docker/build-push-action@v6
        with:
          context: ./login_service
          platforms: linux/amd64
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          file: ./login_service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=login-service
          cache-to: type=gha,mode=max,scope=login-service

  build-gateway-service:
    name: Build Gateway Service 🌐
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository code 🛎️
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx 🚀
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry 🚢
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Gateway Service
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-gateway-service
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Gateway Service 🌐
        uses: docker/build-push-action@v6
        with:
          context: ./gateway_service
          platforms: linux/amd64
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          file: ./gateway_service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=gateway-service
          cache-to: type=gha,mode=max,scope=gateway-service

  # Optional: Deploy to staging/production
  deploy:
    name: Deploy Services 🚀
    runs-on: ubuntu-latest
    needs: [build-main-service, build-login-service, build-gateway-service]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy notification
        run: |
          echo "🎉 All microservices built and pushed successfully!"
          echo "📦 Images available at:"
          echo "   - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-main-service:latest"
          echo "   - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-login-service:latest" 
          echo "   - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-gateway-service:latest"
